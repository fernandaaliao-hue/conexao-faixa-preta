<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inscritos — Conexão Faixa Preta</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,700;0,800;1,900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0b;--ink:#f4f4f5;--muted:#a1a1aa;--red:#ff1f4b;--line:rgba(255,255,255,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Archivo",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:28px 16px 60px}
  .wrap{max-width:1180px;margin:0 auto}
  .kicker{color:var(--red);font-weight:800;font-size:12px;letter-spacing:.4em;text-transform:uppercase}
  h1{font-size:30px;font-weight:900;font-style:italic;text-transform:uppercase;margin-top:4px}
  .bar{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  input{min-height:42px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:15px;min-width:0}
  #busca{flex:1;min-width:200px}
  button{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.24);background:none;color:var(--ink);
         font:inherit;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  button.primary{border:0;background:linear-gradient(180deg,#ff2d57,#d9123c);color:#fff}
  .stats{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
  .stat{padding:12px 16px;border:1px solid var(--line);border-radius:12px;min-width:130px}
  .stat .n{font-size:26px;font-weight:900;font-style:italic}
  .stat .t{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .tbl{margin-top:18px;overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:800;background:rgba(255,255,255,.03)}
  tr:last-child td{border-bottom:0}
  td a{color:var(--ink)}
  .msg{margin-top:16px;color:var(--muted)}
  .err{color:#ff8aa1}
  .login{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;max-width:520px}
  .login input{flex:1}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <span class="kicker">Conexão Faixa Preta</span>
  <h1>Inscritos</h1>

  <form class="login" id="login">
    <input id="chave" type="password" placeholder="Chave de acesso da equipe" autocomplete="current-password">
    <button class="primary" type="submit">Entrar</button>
  </form>

  <div id="painel" class="hide">
    <div class="stats" id="stats"></div>
    <div class="bar">
      <input id="busca" placeholder="Buscar por nome, e-mail ou celular">
      <button type="button" id="atualizar">Atualizar</button>
      <button type="button" class="primary" id="csv">Baixar planilha</button>
      <button type="button" id="sair">Sair</button>
    </div>
    <div class="tbl"><table>
      <thead><tr><th>Nome</th><th>Celular</th><th>E-mail</th><th>Faixa etária</th><th>Faixa</th><th>Grau</th><th>Beneficente</th><th>Qual</th><th>Inscrito em</th></tr></thead>
      <tbody id="linhas"></tbody>
    </table></div>
  </div>
  <p class="msg" id="msg"></p>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const K = "cfp_admin_key";
  let chave = ""; try { chave = sessionStorage.getItem(K) || ""; } catch {}
  let dados = [];

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const cel = (d) => d.length === 11 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}` : d;
  const quando = (t) => new Date(t).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });

  async function carregar() {
    $("msg").textContent = "Carregando…"; $("msg").className = "msg";
    const r = await fetch("/api/inscritos", { headers: { Authorization: "Bearer " + chave } });
    if (r.status === 401) { sair(); $("msg").textContent = "Chave inválida."; $("msg").className = "msg err"; return; }
    const j = await r.json().catch(() => ({}));
    if (!j.ok) { $("msg").textContent = j.erro || "Erro ao carregar."; $("msg").className = "msg err"; return; }
    try { sessionStorage.setItem(K, chave); } catch {}
    dados = j.inscritos; $("login").classList.add("hide"); $("painel").classList.remove("hide"); $("msg").textContent = "";
    render();
  }

  function render() {
    const q = $("busca").value.trim().toLowerCase();
    const lista = q ? dados.filter((l) => [l.nome, l.email, l.celular].join(" ").toLowerCase().includes(q)) : dados;
    const conta = (f) => dados.filter(f).length;
    $("stats").innerHTML = [
      [dados.length, "Inscritos"],
      [conta((l) => l.faixa === "Preta"), "Faixas pretas"],
      [conta((l) => l.faixa === "Não treino"), "Não treinam"],
      [conta((l) => l.beneficente), "Já em projeto beneficente"],
    ].map(([n, t]) => `<div class="stat"><div class="n">${n}</div><div class="t">${t}</div></div>`).join("");
    $("linhas").innerHTML = lista.map((l) => `<tr>
      <td>${esc(l.nome)}</td>
      <td><a href="https://wa.me/55${esc(l.celular)}" target="_blank" rel="noopener">${esc(cel(l.celular))}</a></td>
      <td><a href="mailto:${esc(l.email)}">${esc(l.email)}</a></td>
      <td>${esc(l.faixa_etaria)}</td><td>${esc(l.faixa)}</td><td>${esc(l.grau || "—")}</td>
      <td>${l.beneficente ? "Sim" : "Não"}</td><td>${esc(l.projeto || "—")}</td><td>${quando(l.criado_em)}</td>
    </tr>`).join("") || `<tr><td colspan="9" style="color:var(--muted)">Nenhuma inscrição ${q ? "encontrada" : "ainda"}.</td></tr>`;
  }

  async function baixar() {
    const r = await fetch("/api/inscritos?formato=csv", { headers: { Authorization: "Bearer " + chave } });
    if (!r.ok) return;
    const url = URL.createObjectURL(await r.blob());
    const a = Object.assign(document.createElement("a"), { href: url, download: "inscritos-conexao-faixa-preta.csv" });
    document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }

  function sair() {
    chave = ""; try { sessionStorage.removeItem(K); } catch {}
    $("painel").classList.add("hide"); $("login").classList.remove("hide");
  }

  $("login").addEventListener("submit", (e) => { e.preventDefault(); chave = $("chave").value.trim(); if (chave) carregar(); });
  $("busca").addEventListener("input", render);
  $("atualizar").addEventListener("click", carregar);
  $("csv").addEventListener("click", baixar);
  $("sair").addEventListener("click", sair);
  if (chave) carregar();
</script>
</body>
</html>
