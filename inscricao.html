<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inscrição — Conexão Faixa Preta</title>
<meta name="description" content="Inscreva-se no Conexão Faixa Preta · 20 de outubro de 2026, 19h às 22h, Espaço Full Sales — Vila Olímpia, São Paulo.">
<meta name="theme-color" content="#0a0a0b">
<meta property="og:type" content="website">
<meta property="og:title" content="Conexão Faixa Preta — Inscrição">
<meta property="og:description" content="20 de outubro de 2026 · 19h às 22h · Espaço Full Sales, Vila Olímpia — SP">
<meta property="og:image" content="https://conexao-faixa-preta.vercel.app/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,700;0,800;1,800;1,900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;--ink:#f4f4f5;--muted:#a1a1aa;--red:#ff1f4b;--red-deep:#9e0f2c;
    --line:rgba(255,255,255,.12);--field:rgba(255,255,255,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);
       -webkit-font-smoothing:antialiased;line-height:1.45;min-height:100vh}
  img{display:block;max-width:100%}

  .page{min-height:100vh;min-height:100dvh;display:grid;position:relative;
    background:radial-gradient(ellipse 60% 45% at 50% 0%,rgba(255,31,75,.16),transparent 70%),var(--bg)}
  .hero{position:relative;overflow:hidden;display:flex;justify-content:center}
  .hero img{height:100%;width:auto;max-width:none;object-fit:cover}

  .side{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px}
  .inner{width:100%;max-width:520px}

  .back{display:inline-flex;align-items:center;gap:.4em;color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:.08em}
  .back:hover{color:var(--ink)}
  .back svg{width:16px;height:16px}
  .kicker{display:block;margin-top:18px;color:var(--red);font-weight:800;font-size:12px;letter-spacing:.42em;text-transform:uppercase}
  h1{margin-top:6px;font-size:clamp(30px,4.2vw,44px);line-height:1;font-weight:300;text-transform:uppercase;letter-spacing:-.01em}
  h1 b{font-weight:900;font-style:italic}
  .when{margin-top:12px;color:#d4d4d8;font-size:15px}
  .when strong{color:var(--ink)}

  .embed{margin-top:26px;width:100%;height:720px;border:0;border-radius:16px;background:var(--bg);display:block}
  .fine{margin-top:12px;font-size:12px;color:var(--muted);text-align:center}
  .fine a{color:var(--ink)}
  .brand{margin:28px auto 0;width:110px}

  /* Foto larga (≈2,8:1) em faixa no alto em qualquer tela; o formulário vem logo abaixo */
  .hero{height:clamp(200px, 36vh, 440px)}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;
    -webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent);mask-image:linear-gradient(to bottom,#000 60%,transparent)}
  .side{margin-top:-28px}
  @media (orientation:portrait){ .hero{height:min(32vh, 100vw)} .hero img{object-position:50% 40%} .side{margin-top:0;padding-top:8px} }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <img src="/assets/foto-equipe.jpg" width="1640" height="580" alt="Atletas de quimono preto diante do logo da Full Sales em neon vermelho">
  </header>

  <main class="side">
    <div class="inner">
      <a class="back" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Voltar ao convite
      </a>
      <span class="kicker">Conexão Faixa Preta</span>
      <h1>Garanta sua <b>vaga</b></h1>
      <p class="when"><strong>20 de outubro · terça · 19h às 22h</strong><br>Espaço Full Sales · Vila Olímpia, SP</p>

      <iframe class="embed" src="https://fss-evento.vercel.app/inscricao?evento=cmuo5r879000004jtvj2teyvg"
              title="Formulário de inscrição — Conexão Faixa Preta" loading="lazy"></iframe>
      <p class="fine">O formulário não carregou? <a href="https://fss-evento.vercel.app/inscricao?evento=cmuo5r879000004jtvj2teyvg" target="_blank" rel="noopener">Abrir inscrição em nova aba</a></p>

      <img class="brand" src="/assets/fss.png" width="156" height="41" alt="FSS — Full Sales System">
    </div>
  </main>
</div>

</body>
</html>
